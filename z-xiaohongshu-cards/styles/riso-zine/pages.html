<template data-part="decor"><div class="decor" data-bleed aria-hidden="true"><i class="o1"></i><i class="o2"></i><i class="dots"></i></div></template>
<template data-part="head"><header class="head"><span class="htag">{{tag}}</span><span class="pg">{{no}}</span></header></template>
<template data-page="quote">
  <blockquote class="qtext">{{text}}</blockquote>
  {{#source}}<p class="qsrc">{{source}}</p>{{/source}}
</template>
